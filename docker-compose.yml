version: '3.8'

services:
  app:
    build: .
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/trading_bot.db
      # Add your environment variables here
      # - HYPERLIQUID_PRIVATE_KEY=your_key
      # - HYPERLIQUID_WALLET_ADDRESS=your_address
    volumes:
      - ./data:/app/data
      # Ensure your server.ts/db.ts uses /app/data/trading_bot.db
    restart: always

# Note: You need to make sure the app creates the database in /app/data
